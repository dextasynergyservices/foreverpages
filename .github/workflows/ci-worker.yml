name: CI - Worker Image

on:
  workflow_dispatch:
  push:
    paths:
      - "docker/worker/**"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
      TEMPLATE_WORKER_DOCKER_IMAGE: ${{ secrets.TEMPLATE_WORKER_DOCKER_IMAGE }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to registry (explicit creds or GHCR fallback)
        id: registry-login
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          TEMPLATE_WORKER_DOCKER_IMAGE: ${{ secrets.TEMPLATE_WORKER_DOCKER_IMAGE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -e
          if [ -n "$REGISTRY_USERNAME" ] && [ -n "$REGISTRY_PASSWORD" ]; then
            echo "Logging in with explicit registry credentials"
            echo "$REGISTRY_PASSWORD" | docker login -u "$REGISTRY_USERNAME" --password-stdin
          elif echo "$TEMPLATE_WORKER_DOCKER_IMAGE" | grep -q '^ghcr.io' && [ -n "$GITHUB_TOKEN" ]; then
            echo "Logging in to GHCR using GITHUB_TOKEN as fallback"
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          else
            echo "No registry credentials provided and TEMPLATE_WORKER_DOCKER_IMAGE is not GHCR or GITHUB_TOKEN empty - skipping login"
          fi

      - name: Set image tags
        id: tags
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          DEFAULT_IMAGE="foreverpages/template-worker"
          # read TEMPLATE_WORKER_DOCKER_IMAGE if provided, otherwise fall back to default
          if [ -n "$TEMPLATE_WORKER_DOCKER_IMAGE" ]; then
            INPUT_IMAGE="$TEMPLATE_WORKER_DOCKER_IMAGE"
          else
            INPUT_IMAGE="$DEFAULT_IMAGE:latest"
          fi
          # If INPUT_IMAGE contains a tag, strip it to get the no-tag form
          if echo "$INPUT_IMAGE" | grep -q ":"; then
            IMAGE_NO_TAG=$(echo "$INPUT_IMAGE" | sed 's/:.*$//')
          else
            IMAGE_NO_TAG=$INPUT_IMAGE
          fi
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "IMAGE_NO_TAG=$IMAGE_NO_TAG" >> $GITHUB_OUTPUT
          # determine branch tag (use 'develop' when on develop branch)
          if [ "${GITHUB_REF##refs/heads/}" = "develop" ]; then
            echo "BRANCH_TAG=develop" >> $GITHUB_OUTPUT
          else
            echo "BRANCH_TAG=" >> $GITHUB_OUTPUT
          fi

      - name: Build worker image (latest & sha) with Buildx cache
        env:
          BUILDX_CACHE: ${{ runner.temp }}/buildx-cache
        run: |
          IMAGE_NO_TAG=${{ steps.tags.outputs.IMAGE_NO_TAG }}
          SHORT_SHA=${{ steps.tags.outputs.SHORT_SHA }}
          # Use buildx and local cache to speed up repeated builds
          if [ -n "${{ steps.tags.outputs.BRANCH_TAG }}" ]; then
            docker buildx build --load --tag "${IMAGE_NO_TAG}:latest" --tag "${IMAGE_NO_TAG}:${SHORT_SHA}" --tag "${IMAGE_NO_TAG}:${{ steps.tags.outputs.BRANCH_TAG }}" --cache-to=type=local,dest=${BUILDX_CACHE} --cache-from=type=local,src=${BUILDX_CACHE} docker/worker
          else
            docker buildx build --load --tag "${IMAGE_NO_TAG}:latest" --tag "${IMAGE_NO_TAG}:${SHORT_SHA}" --cache-to=type=local,dest=${BUILDX_CACHE} --cache-from=type=local,src=${BUILDX_CACHE} docker/worker
          fi

      - name: Run static checks in built worker image
        run: |
          IMAGE_NO_TAG=${{ steps.tags.outputs.IMAGE_NO_TAG }}
          echo "Running static checks inside ${IMAGE_NO_TAG}:latest"
          # Run the image; it will execute tsc && eslint per the Dockerfile CMD
          docker run --rm -v "${{ github.workspace }}:/work" "${IMAGE_NO_TAG}:latest"

      - name: Smoke test worker image (fixture run)
        run: |
          IMAGE_NO_TAG=${{ steps.tags.outputs.IMAGE_NO_TAG }}
          echo "Running smoke test: executing fixture inside image"
          # Mount only the fixture folder into the container and run node on it
          docker run --rm -v "${{ github.workspace }}/docker/worker/fixtures:/fixtures" -w /work "${IMAGE_NO_TAG}:latest" sh -c "cp -r /fixtures/sample-template /work/sample-template && node sample-template/index.js"

      - name: Push worker image (latest & sha)
        if: ${{ env.REGISTRY_USERNAME && env.REGISTRY_PASSWORD && env.TEMPLATE_WORKER_DOCKER_IMAGE }}
        run: |
          IMAGE_NO_TAG=${{ steps.tags.outputs.IMAGE_NO_TAG }}
          SHORT_SHA=${{ steps.tags.outputs.SHORT_SHA }}
          BRANCH_TAG=${{ steps.tags.outputs.BRANCH_TAG }}
          docker push "${IMAGE_NO_TAG}:latest"
          docker push "${IMAGE_NO_TAG}:${SHORT_SHA}"
          if [ -n "$BRANCH_TAG" ]; then
            docker push "${IMAGE_NO_TAG}:$BRANCH_TAG"
          fi
