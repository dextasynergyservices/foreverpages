name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.cache-key-generator.outputs.key }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Generate Cache Key
        id: cache-key-generator
        run: echo "key=${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v3
        with:
          path: ~/.pnpm-store
          key: ${{ steps.cache-key-generator.outputs.key }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: setup
    env:
      PRISMA_ENGINES_CHECKSUM_IGNORE_MISSING: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Setup environment
        run: |
          cp .env.example .env
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> .env

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Trace TypeScript resolution for signaling-server (debug)
        run: |
          echo "=== START tsc --traceResolution ==="
          pnpm exec tsc -p signaling-server/tsconfig.json --traceResolution > signaling-server-tsc-trace.txt || true
          echo "--- tsc trace (first 200 lines) ---"
          head -n 200 signaling-server-tsc-trace.txt || true
          echo "=== END tsc --traceResolution ==="

      - name: "Prettier: auto-fix UI primitives"
        run: pnpm exec prettier --write src/components/ui/badge.tsx src/components/ui/button.tsx src/components/ui/sheet.tsx || true

      - name: Run Lint
        run: pnpm lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    needs: setup
    env:
      PRISMA_ENGINES_CHECKSUM_IGNORE_MISSING: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Setup environment
        run: |
          cp .env.example .env
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> .env

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Trace TypeScript resolution for signaling-server (debug)
        run: |
          echo "=== START tsc --traceResolution ==="
          pnpm exec tsc -p signaling-server/tsconfig.json --traceResolution > signaling-server-tsc-trace.txt || true
          echo "--- tsc trace (first 200 lines) ---"
          head -n 200 signaling-server-tsc-trace.txt || true
          echo "=== END tsc --traceResolution ==="

      - name: Install signaling-server devDependencies
        run: pnpm -C signaling-server install

      - name: Build signaling-server
        run: pnpm exec tsc -p signaling-server/tsconfig.json

      - name: Type checking
        run: pnpm exec tsc -p tsconfig.app.json --noEmit

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: setup
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
      NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
      PRISMA_ENGINES_CHECKSUM_IGNORE_MISSING: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install
      - name: Cleanup previous builds
        run: rm -rf .next

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Build signaling-server
        run: pnpm -C signaling-server install && pnpm exec tsc -p signaling-server/tsconfig.json

      - name: Type checking
        run: pnpm exec tsc -p tsconfig.app.json --noEmit

      - name: "Prettier: auto-fix UI primitives (before next build)"
        run: pnpm exec prettier --write src/components/ui/badge.tsx src/components/ui/button.tsx src/components/ui/sheet.tsx || true

      - name: "Prettier: auto-fix UI primitives (before next build)"
        run: pnpm exec prettier --write src/components/ui/badge.tsx src/components/ui/button.tsx src/components/ui/sheet.tsx || true

      - name: Build
        run: pnpm build

  debug-prettier:
    name: Debug Prettier
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Print versions
        run: |
          node --version
          pnpm --version
          pnpm exec prettier --version || true
          pnpm exec eslint --version || true

      - name: Prettier check (debug)
        run: |
          echo '--- prettier check ---'
          pnpm exec prettier --check src/components/ui/badge.tsx src/components/ui/button.tsx src/components/ui/sheet.tsx || true
          echo '--- prettier list-different (debug) ---'
          pnpm exec prettier --list-different --loglevel debug src/components/ui/badge.tsx src/components/ui/button.tsx src/components/ui/sheet.tsx || true
          echo '--- git diff (if any) ---'
          git --no-pager diff -- src/components/ui/badge.tsx src/components/ui/button.tsx src/components/ui/sheet.tsx || true

      - name: ESLint check
        run: pnpm exec eslint src/components/ui/badge.tsx src/components/ui/button.tsx src/components/ui/sheet.tsx || true

  debug-segments:
    name: Debug Segment Exports
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install

      - name: Search for segment-related exports
        run: |
          echo '--- files exporting `config` or containing segment keys ---'
          grep -R "export const config" -n || true
          grep -R "matcher:" -n || true
          grep -R "export const dynamic" -n || true
          grep -R "export const runtime" -n || true
          echo '--- all js/ts files with "export const" occurrences (filtered) ---'
          grep -R "export const" src app | sed -n '1,200p' || true

  debug-prettier:
    name: Debug Prettier
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Print versions
        run: |
          node --version
          pnpm --version
          pnpm exec prettier --version || true
          pnpm exec eslint --version || true

      - name: Prettier check (debug)
        run: |
          echo '--- prettier check ---'
          pnpm exec prettier --check src/components/ui/badge.tsx src/components/ui/button.tsx src/components/ui/sheet.tsx || true
          echo '--- prettier list-different (debug) ---'
          pnpm exec prettier --list-different --loglevel debug src/components/ui/badge.tsx src/components/ui/button.tsx src/components/ui/sheet.tsx || true
          echo '--- git diff (if any) ---'
          git --no-pager diff -- src/components/ui/badge.tsx src/components/ui/button.tsx src/components/ui/sheet.tsx || true

      - name: ESLint check
        run: pnpm exec eslint src/components/ui/badge.tsx src/components/ui/button.tsx src/components/ui/sheet.tsx || true

  debug-segments:
    name: Debug Segment Exports
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install

      - name: Search for segment-related exports
        run: |
          echo '--- files exporting `config` or containing segment keys ---'
          grep -R "export const config" -n || true
          grep -R "matcher:" -n || true
          grep -R "export const dynamic" -n || true
          grep -R "export const runtime" -n || true
          echo '--- all js/ts files with "export const" occurrences (filtered) ---'
          grep -R "export const" src app | sed -n '1,200p' || true
