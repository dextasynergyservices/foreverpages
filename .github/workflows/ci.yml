name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.cache-key-generator.outputs.key }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Generate Cache Key
        id: cache-key-generator
        run: echo "key=${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v3
        with:
          path: ~/.pnpm-store
          key: ${{ steps.cache-key-generator.outputs.key }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: setup
    env:
      PRISMA_ENGINES_CHECKSUM_IGNORE_MISSING: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Setup environment
        run: |
          cp .env.example .env
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> .env

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Trace TypeScript resolution for signaling-server (debug)
        run: |
          echo "=== START tsc --traceResolution ==="
          pnpm exec tsc -p signaling-server/tsconfig.json --traceResolution > signaling-server-tsc-trace.txt || true
          echo "--- tsc trace (first 200 lines) ---"
          head -n 200 signaling-server-tsc-trace.txt || true
          echo "=== END tsc --traceResolution ==="

      - name: Run Lint
        run: pnpm lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    needs: setup
    env:
      PRISMA_ENGINES_CHECKSUM_IGNORE_MISSING: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Setup environment
        run: |
          cp .env.example .env
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> .env

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Trace TypeScript resolution for signaling-server (debug)
        run: |
          echo "=== START tsc --traceResolution ==="
          pnpm exec tsc -p signaling-server/tsconfig.json --traceResolution > signaling-server-tsc-trace.txt || true
          echo "--- tsc trace (first 200 lines) ---"
          head -n 200 signaling-server-tsc-trace.txt || true
          echo "=== END tsc --traceResolution ==="

      - name: Build signaling-server
        run: pnpm exec tsc -p signaling-server/tsconfig.json

      - name: Type checking
        run: pnpm exec tsc -p tsconfig.app.json --noEmit

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: setup
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
      NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
      PRISMA_ENGINES_CHECKSUM_IGNORE_MISSING: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install
      - name: Cleanup previous builds
        run: rm -rf .next

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Build signaling-server
        run: pnpm exec tsc -p signaling-server/tsconfig.json

      - name: Type checking
        run: pnpm exec tsc -p tsconfig.app.json --noEmit

      - name: Build
        run: pnpm build
