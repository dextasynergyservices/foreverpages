name: Template Build Sandbox

on:
  workflow_dispatch:
  repository_dispatch:

jobs:
  build-template:
    runs-on: ubuntu-latest
    env:
      # Secrets expected in repository settings
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      CALLBACK_SECRET: ${{ secrets.TEMPLATE_BUILD_CALLBACK_SECRET }}
    steps:
      - name: Checkout (empty repo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Verify pnpm + Node
        run: |
          pnpm -v
          node -v
          npm -v || true

      - name: Cache pnpm store
        uses: actions/cache@v3
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Download template package
        if: ${{ github.event.client_payload && github.event.client_payload.packageUrl }}
        run: |
          echo "Downloading package from ${GITHUB_EVENT_PATH}"
          PACKAGE_URL=${{ github.event.client_payload.packageUrl }}
          echo "Package URL: $PACKAGE_URL"
          # Save to a temp filename (preserve original name if provided by server)
          TMP_FILE=$(mktemp --suffix=.zip)
          echo "Saving package to $TMP_FILE"
          curl -L "$PACKAGE_URL" -o "$TMP_FILE"
          # Ensure there's a canonical template.zip for later steps
          cp "$TMP_FILE" template.zip || true
          mkdir -p template
          unzip -o template.zip -d template || true

      # Debug step removed — validation now focuses on the extracted `template/` directory

      - name: Install deps
        if: ${{ always() }}
        run: |
          if [ -d template ]; then
            cd template
            pnpm install --frozen-lockfile || pnpm install
          else
            echo "No template directory to install"
          fi

      - name: Build template
        if: ${{ always() }}
        run: |
          if [ -d template ]; then
            cd template
            if [ -f package.json ] && grep -q 'vite' package.json; then
              echo "Detected Vite-based template"
              pnpm build || pnpm vite build || true
            else
              echo "No known build command found; attempting pnpm build"
              pnpm build || true
            fi
          else
            echo "No template directory to build"
          fi

      - name: Collect build output
        if: ${{ always() }}
        run: |
          BUILD_DIR=""
          if [ -d template/dist ]; then BUILD_DIR=template/dist; fi
          if [ -d template/build ]; then BUILD_DIR=template/build; fi
          if [ -z "$BUILD_DIR" ]; then echo "No build output detected"; fi
          echo "BUILD_DIR=$BUILD_DIR" > build_output.txt

      - name: Package build output
        if: ${{ always() }}
        run: |
          BUILD_DIR=""
          if [ -d template/dist ]; then BUILD_DIR=template/dist; fi
          if [ -d template/build ]; then BUILD_DIR=template/build; fi
          if [ -n "$BUILD_DIR" ]; then
            echo "Zipping $BUILD_DIR to build.zip"
            cd "$BUILD_DIR" && zip -r ../../build.zip . || (echo "zip failed" && exit 0)
          else
            if [ -d template ]; then
              echo "No build dir detected; zipping entire template directory to build.zip"
              cd template && zip -r ../build.zip . || (echo "zip failed" && exit 0)
            else
              echo "No build dir to package"
            fi
          fi

      # Removed uploader dependencies install step — not needed for validation-only workflow

      - name: Upload artifacts
        if: ${{ always() }}
        id: upload-artifacts
        uses: actions/upload-artifact@v4
        with:
          name: template-build-artifacts
          path: |
            template/dist
            template/build
            template.zip
            build_output.txt

      - name: Upload built files to Cloudinary
        if: ${{ always() }}
        id: upload-built-files
        run: |
          # Check if dist folder exists
          DIST_FOLDER=""
          if [ -d template/dist ]; then
            DIST_FOLDER="template/dist"
          elif [ -d template/build ]; then
            DIST_FOLDER="template/build"
          fi

          if [ -z "$DIST_FOLDER" ]; then
            echo "No dist/build folder found, skipping Cloudinary upload"
            echo "built_url=" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Uploading built files from $DIST_FOLDER to Cloudinary..."

          # Install cloudinary CLI if needed (lightweight alternative)
          npm install -g cloudinary-cli 2>/dev/null || true

          # Upload all files from dist folder
          TEMPLATE_ID="${{ github.event.client_payload.templateId }}"

          # Create a temporary zip of the built files
          cd "$DIST_FOLDER"
          zip -r ../../dist.zip .
          cd ../..

          # Upload the dist.zip to Cloudinary
          curl -X POST "https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/raw/upload" \
            -F "file=@dist.zip" \
            -F "public_id=templates/${TEMPLATE_ID}/dist" \
            -F "api_key=${CLOUDINARY_API_KEY}" \
            -F "timestamp=$(date +%s)" \
            -F "signature=$(echo -n "public_id=templates/${TEMPLATE_ID}/dist&timestamp=$(date +%s)${CLOUDINARY_API_SECRET}" | openssl dgst -sha1 -hex | cut -d' ' -f2)" \
            -F "resource_type=raw" \
            -F "overwrite=true" > cloudinary_response.json || true

          # Extract the secure_url from response
          BUILT_URL=$(cat cloudinary_response.json | jq -r '.secure_url' 2>/dev/null || echo "")

          if [ -n "$BUILT_URL" ] && [ "$BUILT_URL" != "null" ]; then
            echo "Built files uploaded to: $BUILT_URL"
            echo "built_url=$BUILT_URL" >> $GITHUB_OUTPUT
          else
            echo "Failed to upload built files to Cloudinary"
            echo "built_url=" >> $GITHUB_OUTPUT
          fi

      - name: Validate extracted template and POST callback with artifact
        if: ${{ always() }}
        env:
          TEMPLATE_ID: ${{ github.event.client_payload.templateId }}
          CALLBACK_URL: ${{ github.event.client_payload.callbackUrl }}
          PACKAGE_URL: ${{ github.event.client_payload.packageUrl }}
          BUILT_URL: ${{ steps.upload-built-files.outputs.built_url }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CALLBACK_SECRET: ${{ secrets.TEMPLATE_BUILD_CALLBACK_SECRET }}
        run: |
          # Quick validation: ensure the extracted template directory exists and is non-empty
          STATUS="VALIDATED"
          LOGS=""
          if [ -d template ] && [ "$(ls -A template | wc -l)" -gt 0 ]; then
            LOGS="template directory exists and is non-empty"
            if [ -d template/dist ] || [ -d template/build ]; then
              LOGS="$LOGS, built successfully"
            else
              LOGS="$LOGS, but no build output found"
            fi
          else
            STATUS="ERROR"
            LOGS="Extracted template directory missing or empty"
          fi

          # Use built URL if available, otherwise fall back to source package URL
          ARTIFACT_URL="${BUILT_URL:-$PACKAGE_URL}"

          # Construct callback payload with all necessary info
          PAYLOAD=$(jq -n \
            --arg id "$TEMPLATE_ID" \
            --arg status "$STATUS" \
            --arg runUrl "$GITHUB_RUN_URL" \
            --arg artifactUrl "$ARTIFACT_URL" \
            --arg builtUrl "$BUILT_URL" \
            --arg logs "$LOGS" \
            '{
              templateId: $id,
              status: $status,
              runUrl: $runUrl,
              artifactUrl: $ARTIFACT_URL,
              builtArtifactUrl: $builtUrl,
              logs: $logs
            }')

          if [ -n "$CALLBACK_URL" ]; then
            echo "Posting callback to $CALLBACK_URL"
            echo "  Source URL: $PACKAGE_URL"
            echo "  Built URL: ${BUILT_URL:-none}"
            curl -s -X POST \
              -H "Content-Type: application/json" \
              -H "X-BUILD-CALLBACK-SECRET: $CALLBACK_SECRET" \
              -d "$PAYLOAD" \
              "$CALLBACK_URL" || true
          else
            echo "No callback URL provided; skipping callback"
          fi
