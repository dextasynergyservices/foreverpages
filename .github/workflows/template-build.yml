name: Template Build Sandbox

on:
  workflow_dispatch:
  repository_dispatch:

jobs:
  build-template:
    runs-on: ubuntu-latest
    env:
      # Secrets expected in repository settings
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      CALLBACK_SECRET: ${{ secrets.TEMPLATE_BUILD_CALLBACK_SECRET }}
    steps:
      - name: Checkout (empty repo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Verify pnpm + Node
        run: |
          pnpm -v
          node -v
          npm -v || true

      - name: Cache pnpm store
        uses: actions/cache@v3
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Download template package
        if: ${{ github.event.client_payload && github.event.client_payload.packageUrl }}
        run: |
          echo "Downloading package from ${GITHUB_EVENT_PATH}"
          PACKAGE_URL=${{ github.event.client_payload.packageUrl }}
          echo "Package URL: $PACKAGE_URL"
          # Save to a temp filename (preserve original name if provided by server)
          TMP_FILE=$(mktemp --suffix=.zip)
          echo "Saving package to $TMP_FILE"
          curl -L "$PACKAGE_URL" -o "$TMP_FILE"
          # Ensure there's a canonical template.zip for later steps
          cp "$TMP_FILE" template.zip || true
          mkdir -p template
          unzip -o template.zip -d template || true

      # Debug step removed — validation now focuses on the extracted `template/` directory

      # Removed: Install deps - queue handles building locally

      # Removed: Build template - queue handles this after download

      # Removed: Collect build output - not building in Actions

      # Removed: Package build output - not building in Actions

      # Removed uploader dependencies install step — not needed for validation-only workflow

      - name: Upload artifacts
        if: ${{ always() }}
        id: upload-artifacts
        uses: actions/upload-artifact@v4
        with:
          name: template-validation-artifacts
          path: template.zip

      # Removed: Cloudinary upload step - using source artifact instead

      - name: Validate extracted template and POST callback
        if: ${{ always() }}
        env:
          TEMPLATE_ID: ${{ github.event.client_payload.templateId }}
          CALLBACK_URL: ${{ github.event.client_payload.callbackUrl }}
          PACKAGE_URL: ${{ github.event.client_payload.packageUrl }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CALLBACK_SECRET: ${{ secrets.TEMPLATE_BUILD_CALLBACK_SECRET }}
        run: |
          # Quick validation: ensure the extracted template directory exists and has required files
          STATUS="VALIDATED"
          LOGS=""
          if [ -d template ] && [ "$(ls -A template | wc -l)" -gt 0 ]; then
            # Check for package.json (required for building)
            if [ -f template/package.json ] || find template -maxdepth 2 -name "package.json" | grep -q .; then
              LOGS="Template structure validated successfully. Building will be handled by queue."
            else
              STATUS="ERROR"
              LOGS="No package.json found in template"
            fi
          else
            STATUS="ERROR"
            LOGS="Extracted template directory missing or empty"
          fi

          # Use source package URL (publicly accessible)
          ARTIFACT_URL="$PACKAGE_URL"

          # Construct callback payload with all necessary info
          PAYLOAD=$(jq -n \
            --arg id "$TEMPLATE_ID" \
            --arg status "$STATUS" \
            --arg runUrl "$GITHUB_RUN_URL" \
            --arg artifactUrl "$ARTIFACT_URL" \
            --arg logs "$LOGS" \
            '{
              templateId: $id,
              status: $status,
              runUrl: $runUrl,
              artifactUrl: $artifactUrl,
              logs: $logs
            }')

          if [ -n "$CALLBACK_URL" ]; then
            echo "Posting callback to $CALLBACK_URL"
            echo "  Artifact URL: $PACKAGE_URL"
            curl -s -X POST \
              -H "Content-Type: application/json" \
              -H "X-BUILD-CALLBACK-SECRET: $CALLBACK_SECRET" \
              -d "$PAYLOAD" \
              "$CALLBACK_URL" || true
          else
            echo "No callback URL provided; skipping callback"
          fi
