name: Template Build Sandbox

on:
  workflow_dispatch:
  repository_dispatch:

jobs:
  build-template:
    runs-on: ubuntu-latest
    env:
      # Secrets expected in repository settings
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      CALLBACK_SECRET: ${{ secrets.TEMPLATE_BUILD_CALLBACK_SECRET }}
    steps:
      - name: Checkout (empty repo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Verify pnpm + Node
        run: |
          pnpm -v
          node -v
          npm -v || true

      - name: Cache pnpm store
        uses: actions/cache@v3
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Download template package
        if: ${{ github.event.client_payload && github.event.client_payload.packageUrl }}
        run: |
          echo "Downloading package from ${GITHUB_EVENT_PATH}"
          PACKAGE_URL=${{ github.event.client_payload.packageUrl }}
          echo "Package URL: $PACKAGE_URL"
          curl -L "$PACKAGE_URL" -o template.zip
          unzip template.zip -d template

      - name: Install deps
        if: ${{ always() }}
        run: |
          if [ -d template ]; then
            cd template
            pnpm install --frozen-lockfile || pnpm install
          else
            echo "No template directory to install"
          fi

      - name: Build template
        if: ${{ always() }}
        run: |
          if [ -d template ]; then
            cd template
            if [ -f package.json ] && grep -q 'vite' package.json; then
              echo "Detected Vite-based template"
              pnpm build || pnpm vite build || true
            else
              echo "No known build command found; attempting pnpm build"
              pnpm build || true
            fi
          else
            echo "No template directory to build"
          fi

      - name: Collect build output
        if: ${{ always() }}
        run: |
          BUILD_DIR=""
          if [ -d template/dist ]; then BUILD_DIR=template/dist; fi
          if [ -d template/build ]; then BUILD_DIR=template/build; fi
          if [ -z "$BUILD_DIR" ]; then echo "No build output detected"; fi
          echo "BUILD_DIR=$BUILD_DIR" > build_output.txt

      - name: Package build output
        if: ${{ always() }}
        run: |
          BUILD_DIR=""
          if [ -d template/dist ]; then BUILD_DIR=template/dist; fi
          if [ -d template/build ]; then BUILD_DIR=template/build; fi
          if [ -n "$BUILD_DIR" ]; then
            echo "Zipping $BUILD_DIR to build.zip"
            cd "$BUILD_DIR" && zip -r ../../build.zip . || (echo "zip failed" && exit 0)
          else
            echo "No build dir to package"
          fi

      - name: Install uploader dependencies
        if: ${{ always() }}
        run: |
          # If the extracted template exists, install its deps (which include uploader deps)
          if [ -d template ]; then
            cd template
            pnpm install --frozen-lockfile || pnpm install
            # Ensure uploader helper deps are available in template/node_modules
            pnpm add --no-frozen-lockfile cloudinary@^1.32.0 node-fetch@2 unzipper || true
          else
            # No template dir (no build output). Install uploader deps at repo root as fallback.
            pnpm add --no-frozen-lockfile cloudinary@^1.32.0 node-fetch@2 unzipper
          fi

      - name: Upload build to Cloudinary and POST callback
        if: ${{ always() }}
        env:
          TEMPLATE_ID: ${{ github.event.client_payload.templateId }}
          CALLBACK_URL: ${{ github.event.client_payload.callbackUrl }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CALLBACK_SECRET: ${{ secrets.TEMPLATE_BUILD_CALLBACK_SECRET }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          node -e "const fs=require('fs'); if(!fs.existsSync('build.zip')){console.log('No build.zip found, skipping upload'); process.exit(0);}"
          if [ -d template ]; then
            cat > template/upload_and_callback.js <<'EOF'
          const cloudinary = require('cloudinary').v2;
          const fetch = require('node-fetch');
          const fs = require('fs');
          const path = require('path');
          const os = require('os');
          const unzipper = require('unzipper');

          cloudinary.config({
            cloud_name: process.env.CLOUDINARY_CLOUD_NAME,
            api_key: process.env.CLOUDINARY_API_KEY,
            api_secret: process.env.CLOUDINARY_API_SECRET,
          });

          async function uploadFile(filePath, publicId) {
            return new Promise((resolve, reject) => {
              cloudinary.uploader.upload(filePath, {
                resource_type: 'auto',
                public_id: publicId,
                overwrite: true,
              }, (err, res) => {
                if (err) return reject(err);
                resolve(res);
              });
            });
          }

          (async () => {
            try {
              const zipFile = 'build.zip';
              if (!fs.existsSync(zipFile)) {
                console.log('No build.zip to upload');
                process.exit(0);
              }
              const tmpDir = fs.mkdtempSync(path.join(os.tmpdir(), 'template-build-'));
              console.log('Extracting build.zip to', tmpDir);
              await fs.createReadStream(zipFile).pipe(unzipper.Extract({ path: tmpDir })).promise();

              // Walk files and upload preserving relative paths
              const allFiles = [];
              function walk(dir) {
                for (const name of fs.readdirSync(dir)) {
                  const full = path.join(dir, name);
                  if (fs.statSync(full).isDirectory()) walk(full);
                  else allFiles.push(full);
                }
              }
              walk(tmpDir);

              const assetsMap = {};
              let indexUrl = null;
              for (const file of allFiles) {
                const rel = path.relative(tmpDir, file).replace(/\\/g, '/');
                // Preserve folder structure in public_id by replacing leading/trailing slashes and using __ as separator
                const publicId = `templates/${process.env.TEMPLATE_ID}/${rel}`.replace(/\//g, '__');
                console.log('Uploading', rel, 'as', publicId);
                try {
                  const res = await uploadFile(file, publicId);
                  assetsMap[rel] = res.secure_url;
                  // If this is index.html, record its secure URL
                  if (rel.toLowerCase() === 'index.html') indexUrl = res.secure_url;
                } catch (e) {
                  console.error('Upload failed for', rel, e);
                }
              }

              let artifact = indexUrl;
              if (!artifact) {
                console.log('index.html not found — falling back to zip upload');
                const res = await new Promise((resolve, reject) => {
                  cloudinary.uploader.upload(zipFile, { resource_type: 'raw', folder: `templates/${process.env.TEMPLATE_ID}` }, (err, r) => err ? reject(err) : resolve(r));
                });
                artifact = res.secure_url;
              }

              const payload = {
                templateId: process.env.TEMPLATE_ID,
                artifactUrl: artifact,
                assetsMap,
                runUrl: process.env.GITHUB_RUN_URL,
                status: 'VALIDATED',
                logs: indexUrl ? 'Uploaded unzipped files; index.html available' : 'Uploaded build.zip (no index.html)'
              };

              if (process.env.CALLBACK_URL) {
                console.log('Posting callback to', process.env.CALLBACK_URL);
                await fetch(process.env.CALLBACK_URL, {
                  method: 'POST',
                  headers: {
                    'Content-Type': 'application/json',
                    'X-BUILD-CALLBACK-SECRET': process.env.CALLBACK_SECRET || ''
                  },
                  body: JSON.stringify(payload),
                }).then((r) => console.log('Callback response', r.status));
              } else {
                console.log('No callback URL provided; skipping callback');
              }

            } catch (e) {
              console.error('Upload/callback error', e);
              try {
                if (process.env.CALLBACK_URL) {
                  await fetch(process.env.CALLBACK_URL, {
                    method: 'POST',
                    headers: {
                      'Content-Type': 'application/json',
                      'X-BUILD-CALLBACK-SECRET': process.env.CALLBACK_SECRET || ''
                    },
                    body: JSON.stringify({ templateId: process.env.TEMPLATE_ID, status: 'ERROR', logs: String(e) }),
                  });
                }
              } catch (e2) {
                console.error('Failed to send error callback', e2);
              }
              process.exit(1);
            }
          })();
          EOF
          else
            cat > upload_and_callback.js <<'EOF'
          const cloudinary = require('cloudinary').v2;
          const fetch = require('node-fetch');
          const fs = require('fs');
          const path = require('path');
          const os = require('os');
          const unzipper = require('unzipper');

          cloudinary.config({
            cloud_name: process.env.CLOUDINARY_CLOUD_NAME,
            api_key: process.env.CLOUDINARY_API_KEY,
            api_secret: process.env.CLOUDINARY_API_SECRET,
          });

          async function uploadFile(filePath, publicId) {
            return new Promise((resolve, reject) => {
              cloudinary.uploader.upload(filePath, {
                resource_type: 'auto',
                public_id: publicId,
                overwrite: true,
              }, (err, res) => {
                if (err) return reject(err);
                resolve(res);
              });
            });
          }

          (async () => {
            try {
              const zipFile = 'build.zip';
              if (!fs.existsSync(zipFile)) {
                console.log('No build.zip to upload');
                process.exit(0);
              }
              const tmpDir = fs.mkdtempSync(path.join(os.tmpdir(), 'template-build-'));
              console.log('Extracting build.zip to', tmpDir);
              await fs.createReadStream(zipFile).pipe(unzipper.Extract({ path: tmpDir })).promise();

              // Walk files and upload preserving relative paths
              const allFiles = [];
              function walk(dir) {
                for (const name of fs.readdirSync(dir)) {
                  const full = path.join(dir, name);
                  if (fs.statSync(full).isDirectory()) walk(full);
                  else allFiles.push(full);
                }
              }
              walk(tmpDir);

              const assetsMap = {};
              let indexUrl = null;
              for (const file of allFiles) {
                const rel = path.relative(tmpDir, file).replace(/\\/g, '/');
                const publicId = `templates/${process.env.TEMPLATE_ID}/${rel}`.replace(/\//g, '__');
                console.log('Uploading', rel, 'as', publicId);
                try {
                  const res = await uploadFile(file, publicId);
                  assetsMap[rel] = res.secure_url;
                  if (rel.toLowerCase() === 'index.html') indexUrl = res.secure_url;
                } catch (e) {
                  console.error('Upload failed for', rel, e);
                }
              }

              let artifact = indexUrl;
              if (!artifact) {
                console.log('index.html not found — falling back to zip upload');
                const res = await new Promise((resolve, reject) => {
                  cloudinary.uploader.upload(zipFile, { resource_type: 'raw', folder: `templates/${process.env.TEMPLATE_ID}` }, (err, r) => err ? reject(err) : resolve(r));
                });
                artifact = res.secure_url;
              }

              const payload = {
                templateId: process.env.TEMPLATE_ID,
                artifactUrl: artifact,
                assetsMap,
                runUrl: process.env.GITHUB_RUN_URL,
                status: 'VALIDATED',
                logs: indexUrl ? 'Uploaded unzipped files; index.html available' : 'Uploaded build.zip (no index.html)'
              };

              if (process.env.CALLBACK_URL) {
                console.log('Posting callback to', process.env.CALLBACK_URL);
                await fetch(process.env.CALLBACK_URL, {
                  method: 'POST',
                  headers: {
                    'Content-Type': 'application/json',
                    'X-BUILD-CALLBACK-SECRET': process.env.CALLBACK_SECRET || ''
                  },
                  body: JSON.stringify(payload),
                }).then((r) => console.log('Callback response', r.status));
              } else {
                console.log('No callback URL provided; skipping callback');
              }

            } catch (e) {
              console.error('Upload/callback error', e);
              try {
                if (process.env.CALLBACK_URL) {
                  await fetch(process.env.CALLBACK_URL, {
                    method: 'POST',
                    headers: {
                      'Content-Type': 'application/json',
                      'X-BUILD-CALLBACK-SECRET': process.env.CALLBACK_SECRET || ''
                    },
                    body: JSON.stringify({ templateId: process.env.TEMPLATE_ID, status: 'ERROR', logs: String(e) }),
                  });
                }
              } catch (e2) {
                console.error('Failed to send error callback', e2);
              }
              process.exit(1);
            }
          })();
          EOF
          fi
          # If the template dir exists and we installed deps there, copy build.zip into it and run uploader from that dir
          if [ -d template ]; then
            if [ -f build.zip ]; then
              cp build.zip template/ || true
            fi
            (cd template && node upload_and_callback.js)
          else
            node upload_and_callback.js
          fi

      - name: Upload artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: template-build-artifacts
          path: |
            template/dist
            template/build
            template.zip
            build_output.txt

      - name: Send callback
        if: ${{ github.event.client_payload && github.event.client_payload.callbackUrl }}
        env:
          CALLBACK_URL: ${{ github.event.client_payload.callbackUrl }}
          TEMPLATE_ID: ${{ github.event.client_payload.templateId }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          echo "Posting callback to $CALLBACK_URL"
          PAYLOAD=$(jq -n --arg id "$TEMPLATE_ID" --arg runUrl "$GITHUB_RUN_URL" '{ templateId: $id, runUrl: $runUrl, runId: env.GITHUB_RUN_ID }')
          curl -s -X POST -H "Content-Type: application/json" -d "$PAYLOAD" "$CALLBACK_URL" || true
