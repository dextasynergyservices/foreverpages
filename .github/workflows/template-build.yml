name: Template Build Sandbox

on:
  workflow_dispatch:
  repository_dispatch:

jobs:
  build-template:
    runs-on: ubuntu-latest
    env:
      # Secrets expected in repository settings
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      CALLBACK_SECRET: ${{ secrets.TEMPLATE_BUILD_CALLBACK_SECRET }}
    steps:
      - name: Checkout (empty repo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Verify pnpm + Node
        run: |
          pnpm -v
          node -v
          npm -v || true

      - name: Cache pnpm store
        uses: actions/cache@v3
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Download template package
        if: ${{ github.event.client_payload && github.event.client_payload.packageUrl }}
        run: |
          echo "Downloading package from ${GITHUB_EVENT_PATH}"
          PACKAGE_URL=${{ github.event.client_payload.packageUrl }}
          echo "Package URL: $PACKAGE_URL"
          # Save to a temp filename (preserve original name if provided by server)
          TMP_FILE=$(mktemp --suffix=.zip)
          echo "Saving package to $TMP_FILE"
          curl -L "$PACKAGE_URL" -o "$TMP_FILE"
          # Ensure there's a canonical template.zip for later steps
          cp "$TMP_FILE" template.zip || true
          mkdir -p template-temp
          unzip -o template.zip -d template-temp || true

          # Check if ZIP contained a single root folder and flatten it
          ITEM_COUNT=$(ls -A template-temp | wc -l)
          echo "Extracted items count: $ITEM_COUNT"
          ls -la template-temp

          if [ "$ITEM_COUNT" -eq 1 ]; then
            INNER=$(ls -A template-temp)
            if [ -d "template-temp/$INNER" ]; then
              echo "ZIP contains single folder '$INNER', flattening..."
              mv "template-temp/$INNER" template
              rmdir template-temp
            else
              echo "ZIP contains single file, using as-is"
              mv template-temp template
            fi
          else
            echo "ZIP contains multiple items at root, using as-is"
            mv template-temp template
          fi

          echo "Final template structure:"
          ls -la template

      # Debug step removed — validation now focuses on the extracted `template/` directory

      - name: Install dependencies
        run: |
          cd template
          pnpm install --no-frozen-lockfile

      - name: Build template
        run: |
          cd template
          echo "=== Before build ==="
          ls -la
          pnpm run build
          echo "=== After build ==="
          ls -la
          echo "=== Checking common output directories ==="
          ls -la dist/ 2>/dev/null || echo "No dist/"
          ls -la build/ 2>/dev/null || echo "No build/"
          ls -la .next/ 2>/dev/null || echo "No .next/"
          ls -la out/ 2>/dev/null || echo "No out/"
          ls -la public/ 2>/dev/null || echo "No public/ changes"

      - name: Package build output
        run: |
          cd template
          # Find the actual build output directory
          if [ -d dist ]; then
            BUILD_DIR="dist"
          elif [ -d build ]; then
            BUILD_DIR="build"
          elif [ -d .next ]; then
            BUILD_DIR=".next"
          elif [ -d out ]; then
            BUILD_DIR="out"
          else
            echo "ERROR: No build output found in dist/, build/, .next/, or out/"
            echo "Contents of template directory:"
            ls -la
            exit 1
          fi
          echo "Found build output in: $BUILD_DIR"
          cd "$BUILD_DIR" && zip -r ../../built-template.zip . && cd ../..
          ls -lh built-template.zip

      - name: Install uploader dependencies
        run: |
          mkdir -p uploader
          cd uploader
          pnpm init
          pnpm add cloudinary
          cd ..

      - name: Upload artifacts
        if: ${{ always() }}
        id: upload-artifacts
        uses: actions/upload-artifact@v4
        with:
          name: template-build-artifacts
          path: |
            template.zip
            built-template.zip

      - name: Upload built files to Cloudinary
        id: cloudinary-upload
        env:
          TEMPLATE_ID: ${{ github.event.client_payload.templateId }}
        run: |
          NODE_PATH="$(pwd)/uploader/node_modules" node -e "
          const cloudinary = require('cloudinary').v2;
          const fs = require('fs');
          const path = require('path');

          cloudinary.config({
            cloud_name: process.env.CLOUDINARY_CLOUD_NAME,
            api_key: process.env.CLOUDINARY_API_KEY,
            api_secret: process.env.CLOUDINARY_API_SECRET
          });

          // Upload individual built files instead of ZIP
          async function uploadDirectory(dirPath, basePath = '') {
            const files = {};
            const entries = fs.readdirSync(dirPath, { withFileTypes: true });

            for (const entry of entries) {
              const fullPath = path.join(dirPath, entry.name);
              const relativePath = basePath ? path.join(basePath, entry.name) : entry.name;

              if (entry.isDirectory()) {
                const subFiles = await uploadDirectory(fullPath, relativePath);
                Object.assign(files, subFiles);
              } else {
                try {
                  const ext = path.extname(entry.name).toLowerCase();
                  let resourceType = 'raw';
                  if (['.jpg', '.jpeg', '.png', '.gif', '.webp', '.svg'].includes(ext)) {
                    resourceType = 'image';
                  }

                  // For raw files, keep extension in public_id
                  const publicId = resourceType === 'raw' 
                    ? relativePath
                    : relativePath.replace(/\.[^.]+$/, '');

                  const result = await cloudinary.uploader.upload(fullPath, {
                    folder: 'templates/' + process.env.TEMPLATE_ID + '/dist',
                    public_id: publicId,
                    resource_type: resourceType,
                    overwrite: true,
                    access_mode: 'public'
                  });

                  files[relativePath] = result.secure_url;
                  console.log('Uploaded: ' + relativePath + ' -> ' + result.secure_url);
                } catch (err) {
                  console.error('Failed to upload ' + relativePath + ':', err);
                }
              }
            }
            return files;
          }

          (async () => {
            try {
              // Find dist directory
              let distDir = 'template/dist';
              if (!fs.existsSync(distDir)) {
                distDir = 'template/build';
              }
              
              console.log('Uploading files from: ' + distDir);
              const builtFiles = await uploadDirectory(distDir);
              
              // Save as JSON for callback
              const filesJson = JSON.stringify(builtFiles);
              fs.writeFileSync('built-files.json', filesJson);
              fs.appendFileSync(process.env.GITHUB_OUTPUT, 'built_files=' + Buffer.from(filesJson).toString('base64') + '\n');
              
              console.log('Uploaded ' + Object.keys(builtFiles).length + ' files');
            } catch (err) {
              console.error('Cloudinary upload failed:', err);
              console.error('Error details:', JSON.stringify(err, null, 2));
              process.exit(1);
            }
          })();
          "

      - name: Validate template and POST callback
        if: ${{ always() }}
        env:
          TEMPLATE_ID: ${{ github.event.client_payload.templateId }}
          CALLBACK_URL: ${{ github.event.client_payload.callbackUrl }}
          PACKAGE_URL: ${{ github.event.client_payload.packageUrl }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CALLBACK_SECRET: ${{ secrets.TEMPLATE_BUILD_CALLBACK_SECRET }}
        run: |
          # Quick validation: ensure the extracted template directory exists and has required files
          STATUS="VALIDATED"
          LOGS=""
          if [ -d template ] && [ "$(ls -A template | wc -l)" -gt 0 ]; then
            # Check for package.json (required for building)
            if [ -f template/package.json ] || find template -maxdepth 2 -name "package.json" | grep -q .; then
              LOGS="Template built successfully with pnpm in GitHub Actions"
            else
              STATUS="ERROR"
              LOGS="No package.json found in template"
            fi
          else
            STATUS="ERROR"
            LOGS="Extracted template directory missing or empty"
          fi

          # Use source package URL (publicly accessible)
          ARTIFACT_URL="$PACKAGE_URL"
          BUILT_URL="${{ steps.cloudinary-upload.outputs.built_url }}"

          # Get built files from output
          BUILT_FILES="${{ steps.cloudinary-upload.outputs.built_files }}"
          
          # Debug: Print what we're sending
          echo "=== Callback Payload Debug ==="
          echo "ARTIFACT_URL (source): $ARTIFACT_URL"
          echo "BUILT_FILES: ${BUILT_FILES:0:200}..."
          echo "STATUS: $STATUS"
          echo "=============================="

          # Construct callback payload with built files map
          PAYLOAD=$(jq -n \
            --arg id "$TEMPLATE_ID" \
            --arg status "$STATUS" \
            --arg runUrl "$GITHUB_RUN_URL" \
            --arg artifactUrl "$ARTIFACT_URL" \
            --arg builtFilesBase64 "$BUILT_FILES" \
            --arg logs "$LOGS" \
            '{
              templateId: $id,
              status: $status,
              runUrl: $runUrl,
              artifactUrl: $artifactUrl,
              builtFilesBase64: $builtFilesBase64,
              logs: $logs
            }')

          echo "Constructed payload:"
          echo "$PAYLOAD" | jq .

          if [ -n "$CALLBACK_URL" ]; then
            echo "Posting callback to $CALLBACK_URL"
            echo "  Source Artifact URL: $ARTIFACT_URL"
            echo "  Built Artifact URL: $BUILT_URL"
            curl -s -X POST \
              -H "Content-Type: application/json" \
              -H "X-BUILD-CALLBACK-SECRET: $CALLBACK_SECRET" \
              -d "$PAYLOAD" \
              "$CALLBACK_URL" || true
          else
            echo "No callback URL provided; skipping callback"
          fi
